plugins { id "com.android.application" }

def remoteHudKeystorePath = System.getenv("REMOTE_HUD_KEYSTORE_PATH")
def remoteHudVersionCode = (System.getenv("REMOTE_HUD_VERSION_CODE") ?: "133").toInteger()
def remoteHudVersionName = System.getenv("REMOTE_HUD_VERSION_NAME") ?: "1.16-nav-switch-stop"

android {
  namespace "ai.comma.remotehud"
  compileSdk 35
  defaultConfig {
    applicationId "ai.comma.remotehud"
    minSdk 26
    targetSdk 35
    versionCode remoteHudVersionCode
    versionName remoteHudVersionName
    // The target SM-G960F / LineageOS 20 installation is arm64. Avoid bundling
    // unused x86/32-bit TensorFlow native runtimes into the signed APK.
    ndk { abiFilters "arm64-v8a" }
  }
  signingConfigs {
    remoteHudStable {
      if (remoteHudKeystorePath) {
        storeFile file(remoteHudKeystorePath)
        storePassword System.getenv("REMOTE_HUD_KEYSTORE_PASSWORD")
        keyAlias System.getenv("REMOTE_HUD_KEY_ALIAS")
        keyPassword System.getenv("REMOTE_HUD_KEY_PASSWORD")
        storeType "PKCS12"
      }
    }
  }
  buildTypes {
    debug {
      // Local builds may keep Android's normal debug key. CI always supplies
      // the permanent Remote HUD key so every downloaded APK is updatable.
      if (remoteHudKeystorePath) {
        signingConfig signingConfigs.remoteHudStable
      }
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
  androidResources { noCompress "tflite" }
}

dependencies {
  // Standalone runtime: works on the user's LineageOS S9 without requiring
  // Google Play services.  CPU inference is deliberately rate-limited.
  implementation "org.tensorflow:tensorflow-lite-task-vision:0.4.0"
}
