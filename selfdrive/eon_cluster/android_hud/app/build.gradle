plugins { id "com.android.application" }

def remoteHudKeystorePath = System.getenv("REMOTE_HUD_KEYSTORE_PATH")
def remoteHudVersionCode = (System.getenv("REMOTE_HUD_VERSION_CODE") ?: "191").toInteger()
def remoteHudVersionName = System.getenv("REMOTE_HUD_VERSION_NAME") ?: "1.80-temp-log"

android {
  namespace "ai.comma.remotehud"
  compileSdk 35
  defaultConfig {
    applicationId "ai.comma.remotehud"
    minSdk 26
    targetSdk 35
    versionCode remoteHudVersionCode
    versionName remoteHudVersionName
    // The HUD phones are arm64; other ABIs would only add ONNX Runtime libraries.
    ndk { abiFilters "arm64-v8a" }
  }
  signingConfigs {
    remoteHudStable {
      if (remoteHudKeystorePath) {
        storeFile file(remoteHudKeystorePath)
        storePassword System.getenv("REMOTE_HUD_KEYSTORE_PASSWORD")
        keyAlias System.getenv("REMOTE_HUD_KEY_ALIAS")
        keyPassword System.getenv("REMOTE_HUD_KEY_PASSWORD")
        storeType "PKCS12"
      }
    }
  }
  buildTypes {
    debug {
      // Local builds may keep Android's normal debug key. CI always supplies
      // the permanent Remote HUD key so every downloaded APK is updatable.
      if (remoteHudKeystorePath) {
        signingConfig signingConfigs.remoteHudStable
      }
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}

dependencies {
  // Autoware traffic light networks (TrafficLightDetector); the models are downloaded at run time.
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.17.3"
}
