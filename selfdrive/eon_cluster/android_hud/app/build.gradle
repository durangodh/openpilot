plugins { id "com.android.application" }

android {
  namespace "ai.comma.remotehud"
  compileSdk 35
  defaultConfig {
    applicationId "ai.comma.remotehud"
    minSdk 26
    targetSdk 35
    versionCode 16
    versionName "0.16-runtime-layout"
    buildConfigField "String", "HUD_VERSION_LABEL", "\"v0.16\""
  }
  buildFeatures {
    buildConfig true
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}
