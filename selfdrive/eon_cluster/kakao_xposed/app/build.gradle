plugins { id "com.android.application" }

def hudVersionCode = (System.getenv("KAKAO_HUD_VERSION_CODE") ?: "1").toInteger()
def hudVersionName = System.getenv("KAKAO_HUD_VERSION_NAME") ?: "0.1-recon"

android {
  namespace "ai.comma.kakaohud"
  compileSdk 35
  defaultConfig {
    applicationId "ai.comma.kakaohud"
    minSdk 26
    targetSdk 35
    versionCode hudVersionCode
    versionName hudVersionName
    // 로그에 모듈 빌드 번호를 남겨, 새 빌드가 실제로 적용됐는지 바로 알 수 있게 한다.
    buildConfigField "int", "HUD_BUILD", "${hudVersionCode}"
  }
  buildFeatures { buildConfig true }
  buildTypes {
    debug { }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}

dependencies {
  // Xposed API 는 컴파일 전용(런타임은 LSPosed 가 제공).
  compileOnly "de.robv.android.xposed:api:82"
}
