plugins { id "com.android.application" }

// Signed with the same permanent key as the Remote HUD so a downloaded APK
// always updates the installed one.
def keystorePath = System.getenv("REMOTE_HUD_KEYSTORE_PATH")
def remoteKeyVersionCode = (System.getenv("REMOTE_KEY_VERSION_CODE") ?: "1").toInteger()
def remoteKeyVersionName = System.getenv("REMOTE_KEY_VERSION_NAME") ?: "1.0-relay"

android {
  namespace "ai.comma.remotekey"
  compileSdk 35
  defaultConfig {
    applicationId "ai.comma.remotekey"
    minSdk 29
    targetSdk 35
    versionCode remoteKeyVersionCode
    versionName remoteKeyVersionName
  }
  signingConfigs {
    stable {
      if (keystorePath) {
        storeFile file(keystorePath)
        storePassword System.getenv("REMOTE_HUD_KEYSTORE_PASSWORD")
        keyAlias System.getenv("REMOTE_HUD_KEY_ALIAS")
        keyPassword System.getenv("REMOTE_HUD_KEY_PASSWORD")
        storeType "PKCS12"
      }
    }
  }
  buildTypes {
    debug {
      if (keystorePath) {
        signingConfig signingConfigs.stable
      }
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}
