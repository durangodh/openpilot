plugins { id "com.android.application" }

android {
  namespace "ai.comma.eonbleremote"
  compileSdk 35
  defaultConfig {
    applicationId project.findProperty("remotePackage") ?: "ai.comma.eonbleremote"
    minSdk 21
    targetSdk 25
    versionCode 1
    versionName "1.0"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}
