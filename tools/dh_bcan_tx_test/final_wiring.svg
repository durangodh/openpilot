<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111">제네시스 DH 자동 깜빡이 최종 배선도 (상시 장착)</text>
  <text x="600" y="64" text-anchor="middle" font-size="14" fill="#555">리모컨·NOO 차선변경 → EON → Wi-Fi → ESP32 → B-CAN 0x138 원터치 → BCM → 외부 램프 5회</text>

  <!-- ===== Car M01 ===== -->
  <rect x="30" y="110" width="240" height="300" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="150" y="140" text-anchor="middle" font-size="17" font-weight="700">차량 M01</text>
  <text x="150" y="162" text-anchor="middle" font-size="13" fill="#444">다기능 스위치 (회색 10핀)</text>
  <text x="150" y="180" text-anchor="middle" font-size="12" fill="#666">T-탭으로 분기 (전선 절단 금지)</text>
  <rect x="70" y="195" width="170" height="80" fill="#ddd" stroke="#555"/>
  <g font-size="13" text-anchor="middle">
    <rect x="76" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="90" y="221">5</text>
    <rect x="108" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="122" y="221">4</text>
    <rect x="140" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="154" y="221">3</text>
    <rect x="172" y="201" width="28" height="30" fill="#fb8c00" stroke="#e65100"/><text x="186" y="221" fill="#fff" font-weight="700">2</text>
    <rect x="204" y="201" width="28" height="30" fill="#4caf50" stroke="#2e7d32"/><text x="218" y="221" fill="#fff" font-weight="700">1</text>
    <rect x="76" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="90" y="259">10</text>
    <rect x="108" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="122" y="259">9</text>
    <rect x="140" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="154" y="259">8</text>
    <rect x="172" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="186" y="259">7</text>
    <rect x="204" y="239" width="28" height="30" fill="#212121" stroke="#000"/><text x="218" y="259" fill="#fff" font-weight="700">6</text>
  </g>
  <g font-size="14">
    <circle cx="55" cy="310" r="7" fill="#4caf50"/><text x="69" y="315"><tspan font-weight="700">1번 녹색</tspan> B-CAN High</text>
    <circle cx="55" cy="340" r="7" fill="#fb8c00"/><text x="69" y="345"><tspan font-weight="700">2번 주황</tspan> B-CAN Low</text>
    <circle cx="55" cy="370" r="7" fill="#212121"/><text x="69" y="375"><tspan font-weight="700">6번 검정</tspan> 접지(GND)</text>
  </g>
  <text x="150" y="398" text-anchor="middle" font-size="12" fill="#c62828" font-weight="700">노란 커넥터(에어백) 건드리지 말 것</text>

  <!-- ===== Converter #2 ===== -->
  <rect x="330" y="110" width="300" height="300" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="480" y="140" text-anchor="middle" font-size="17" font-weight="700">변환기 #2 (B-CAN 전용, 새 제품)</text>
  <text x="480" y="162" text-anchor="middle" font-size="13" fill="#444">TJA1054 저속↔고속 · 테스트 때와 같은 종류</text>
  <rect x="342" y="200" width="88" height="80" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="386" y="194" text-anchor="middle" font-size="12" fill="#1b5e20">저속 단자</text>
  <text x="354" y="230" font-size="14" font-weight="700">CANH</text>
  <text x="354" y="265" font-size="14" font-weight="700">CANL</text>
  <rect x="530" y="185" width="88" height="200" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="574" y="179" text-anchor="middle" font-size="12" fill="#1b5e20">고속·전원 단자</text>
  <g font-size="14" font-weight="700">
    <text x="540" y="213">9~24V</text>
    <text x="540" y="250">CANH</text>
    <text x="540" y="287" fill="#888">PE ✕</text>
    <text x="540" y="324">CANL</text>
    <text x="540" y="361">GND</text>
  </g>
  <rect x="380" y="320" width="120" height="44" rx="6" fill="#fff59d" stroke="#f9a825"/>
  <text x="440" y="339" text-anchor="middle" font-size="12" font-weight="700">종단 점퍼</text>
  <text x="440" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">기본값 그대로</text>

  <!-- ===== ESP32 board ===== -->
  <rect x="720" y="110" width="250" height="300" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="845" y="140" text-anchor="middle" font-size="17" font-weight="700">ESP32-S3-RS485-CAN</text>
  <text x="845" y="162" text-anchor="middle" font-size="13" fill="#444">자동 깜빡이 펌웨어 (다음 단계)</text>
  <rect x="732" y="222" width="70" height="80" fill="#90caf9" stroke="#1565c0"/>
  <text x="767" y="216" text-anchor="middle" font-size="12" fill="#0d47a1">CAN 단자</text>
  <text x="744" y="250" font-size="14" font-weight="700">H</text>
  <text x="744" y="287" font-size="14" font-weight="700">L</text>
  <rect x="732" y="330" width="90" height="60" fill="#90caf9" stroke="#1565c0"/>
  <text x="777" y="324" text-anchor="middle" font-size="12" fill="#0d47a1">DC 단자</text>
  <text x="740" y="353" font-size="13" font-weight="700">VIN 7~36V</text>
  <text x="740" y="378" font-size="13" font-weight="700">GND</text>
  <rect x="830" y="222" width="120" height="40" rx="6" fill="#fff59d" stroke="#f9a825"/>
  <text x="890" y="240" text-anchor="middle" font-size="12" font-weight="700">CAN 120Ω 점퍼</text>
  <text x="890" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">120R</text>
  <text x="890" y="290" text-anchor="middle" font-size="12" fill="#888">RS485 · USB-C 사용 안 함</text>
  <text x="890" y="310" text-anchor="middle" font-size="12" fill="#888">(USB-C는 펌웨어 수정 때만)</text>
  <!-- wifi icon -->
  <g fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round">
    <path d="M920 196 a26 26 0 0 1 36 0"/><path d="M926 203 a17 17 0 0 1 24 0"/>
  </g>
  <circle cx="938" cy="210" r="3.5" fill="#1565c0"/>

  <!-- ===== EON + panda ===== -->
  <rect x="1010" y="110" width="170" height="150" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="1095" y="140" text-anchor="middle" font-size="17" font-weight="700">EON</text>
  <text x="1095" y="162" text-anchor="middle" font-size="13" fill="#444">오픈파일럿</text>
  <text x="1095" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Wi-Fi 핫스팟 켬</text>
  <text x="1095" y="218" text-anchor="middle" font-size="12" fill="#444">차선변경 시작 때</text>
  <text x="1095" y="236" text-anchor="middle" font-size="12" fill="#444">왼/오 깜빡이 요청 전송</text>
  <rect x="1010" y="290" width="170" height="120" rx="10" fill="#eeeeee" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1095" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#555">판다 + 변환기 #1</text>
  <text x="1095" y="340" text-anchor="middle" font-size="12" fill="#666">(M-CAN HUD용)</text>
  <text x="1095" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#555">기존 배선 그대로</text>
  <text x="1095" y="390" text-anchor="middle" font-size="12" fill="#666">손대지 않음</text>
  <path d="M1095 260 L1095 290" stroke="#9e9e9e" stroke-width="4"/>

  <!-- Wi-Fi link -->
  <path d="M960 185 L1010 185" fill="none" stroke="#5e35b1" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="985" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">Wi-Fi</text>

  <!-- ===== Wires ===== -->
  <path d="M232 216 L305 216 L305 225 L342 225" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linejoin="round"/>
  <path d="M186 231 L186 238 L318 238 L318 260 L342 260" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round"/>
  <path d="M618 250 L732 250" fill="none" stroke="#f9a825" stroke-width="5"/>
  <text x="672" y="242" text-anchor="middle" font-size="12" font-weight="700">CANH</text>
  <path d="M618 319 L705 319 L705 285 L732 285" fill="none" stroke="#1e88e5" stroke-width="5" stroke-linejoin="round"/>
  <text x="675" y="311" text-anchor="middle" font-size="12" font-weight="700">CANL</text>

  <!-- ground -->
  <path d="M218 269 L218 290 L290 290 L290 460 L665 460 L665 357 L618 357" fill="none" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
  <path d="M665 460 L712 460 L712 373 L732 373" fill="none" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
  <text x="470" y="452" text-anchor="middle" font-size="12" font-weight="700">GND (M01 6번 또는 차체 볼트)</text>

  <!-- 12 V, drawn last with a white halo so crossings read as jumps -->
  <rect x="330" y="500" width="260" height="66" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="460" y="527" text-anchor="middle" font-size="15" font-weight="700">차량 12V (퓨즈 탭, IGN)</text>
  <text x="460" y="550" text-anchor="middle" font-size="12" fill="#444">시동 ON에서만 전원 · 퓨즈 2A</text>
  <g fill="none" stroke-linejoin="round">
    <path d="M590 533 L650 533 L650 208 L618 208" stroke="#fff" stroke-width="11"/>
    <path d="M650 533 L690 533 L690 347 L732 347" stroke="#fff" stroke-width="11"/>
    <path d="M590 533 L650 533 L650 208 L618 208" stroke="#d32f2f" stroke-width="5"/>
    <path d="M650 533 L690 533 L690 347 L732 347" stroke="#d32f2f" stroke-width="5"/>
  </g>
  <circle cx="650" cy="533" r="6" fill="#d32f2f"/>
  <text x="620" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#d32f2f">+12V</text>

  <!-- Notes -->
  <g font-size="13" fill="#222">
    <text x="30" y="612" font-weight="700">확인 사항</text>
    <text x="30" y="636">• 변환기 #2는 B-CAN 전용 새 제품. 테스트 때 빌려 쓴 M-CAN 변환기 #1은 원래 자리(판다·M-CAN HUD)로 되돌립니다.</text>
    <text x="30" y="660">• 점퍼는 송신 테스트 때와 같음: 변환기 기본값, 보드 120R → 전원 끄고 보드 H–L 약 60Ω 또는 120Ω.</text>
    <text x="30" y="684">• 보드 전원은 노트북 USB 대신 DC 단자(VIN·GND)에 시동 연동 12V. 상시 전원(B+)에 물리면 배터리 방전 위험.</text>
    <text x="30" y="708">• 보드 CAN은 절연형이라 CAN 쪽 GND는 필요 없고, DC 단자 GND는 전원용으로 차체 접지에 연결합니다.</text>
    <text x="30" y="732">• EON↔ESP32는 Wi-Fi(EON 핫스팟에 ESP32 접속)로 계획. 연동 펌웨어와 오픈파일럿 코드는 송신 테스트 성공 후 만듭니다.</text>
    <text x="30" y="756">• 운전자가 레버를 쓰고 있거나 비상등이 켜져 있으면 ESP32가 아무것도 보내지 않게 만듭니다(송신 테스트 펌웨어의 레버 보호 + 비상등 확인).</text>
  </g>
</svg>
