<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111">제네시스 DH 자동 깜빡이 최종 배선도 (직결, 상시 장착)</text>
  <text x="600" y="64" text-anchor="middle" font-size="14" fill="#555">리모컨·NOO 차선변경 → EON → Wi-Fi(S20 핫스팟) → ESP32 → B-CAN 0x138 원터치 → BCM → 외부 램프 5회</text>

  <!-- ===== Car M01 ===== -->
  <rect x="30" y="110" width="260" height="300" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="160" y="140" text-anchor="middle" font-size="17" font-weight="700">차량 M01</text>
  <text x="160" y="162" text-anchor="middle" font-size="13" fill="#444">다기능 스위치 (회색 10핀)</text>
  <text x="160" y="180" text-anchor="middle" font-size="12" fill="#666">T-탭으로 분기 (전선 절단 금지)</text>
  <rect x="75" y="195" width="170" height="80" fill="#ddd" stroke="#555"/>
  <g font-size="13" text-anchor="middle">
    <rect x="81" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="95" y="221">5</text>
    <rect x="113" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="127" y="221">4</text>
    <rect x="145" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="159" y="221">3</text>
    <rect x="177" y="201" width="28" height="30" fill="#fb8c00" stroke="#e65100"/><text x="191" y="221" fill="#fff" font-weight="700">2</text>
    <rect x="209" y="201" width="28" height="30" fill="#4caf50" stroke="#2e7d32"/><text x="223" y="221" fill="#fff" font-weight="700">1</text>
    <rect x="81" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="95" y="259">10</text>
    <rect x="113" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="127" y="259">9</text>
    <rect x="145" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="159" y="259">8</text>
    <rect x="177" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="191" y="259">7</text>
    <rect x="209" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="223" y="259">6</text>
  </g>
  <g font-size="14">
    <circle cx="60" cy="315" r="7" fill="#4caf50"/><text x="74" y="320"><tspan font-weight="700">1번 녹색</tspan> B-CAN High</text>
    <circle cx="60" cy="345" r="7" fill="#fb8c00"/><text x="74" y="350"><tspan font-weight="700">2번 주황</tspan> B-CAN Low</text>
  </g>
  <text x="160" y="392" text-anchor="middle" font-size="12" fill="#c62828" font-weight="700">노란 커넥터(에어백) 건드리지 말 것</text>

  <!-- ===== ESP32 board ===== -->
  <rect x="560" y="110" width="330" height="300" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="725" y="140" text-anchor="middle" font-size="17" font-weight="700">ESP32-S3-RS485-CAN</text>
  <text x="725" y="162" text-anchor="middle" font-size="13" fill="#444">자동 깜빡이 펌웨어 · CAN 절연형</text>
  <rect x="572" y="202" width="70" height="80" fill="#90caf9" stroke="#1565c0"/>
  <text x="607" y="196" text-anchor="middle" font-size="12" fill="#0d47a1">CAN 단자</text>
  <text x="584" y="230" font-size="14" font-weight="700">H</text>
  <text x="584" y="265" font-size="14" font-weight="700">L</text>
  <rect x="572" y="320" width="100" height="60" fill="#90caf9" stroke="#1565c0"/>
  <text x="622" y="314" text-anchor="middle" font-size="12" fill="#0d47a1">DC 단자</text>
  <text x="580" y="343" font-size="13" font-weight="700">VIN 7~36V</text>
  <text x="580" y="368" font-size="13" font-weight="700">GND</text>
  <rect x="680" y="202" width="150" height="48" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="755" y="222" text-anchor="middle" font-size="13" font-weight="700">CAN 120Ω 점퍼</text>
  <text x="755" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">반드시 NC</text>
  <text x="755" y="272" text-anchor="middle" font-size="12" fill="#444">120R이면 B-CAN이 무너짐</text>
  <text x="755" y="300" text-anchor="middle" font-size="12" fill="#888">RS485 · USB-C 사용 안 함</text>
  <text x="755" y="318" text-anchor="middle" font-size="12" fill="#888">(USB-C는 펌웨어 수정 때만)</text>
  <g fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round">
    <path d="M840 150 a26 26 0 0 1 36 0"/><path d="M846 157 a17 17 0 0 1 24 0"/>
  </g>
  <circle cx="858" cy="164" r="3.5" fill="#1565c0"/>

  <!-- ===== S20 + EON ===== -->
  <rect x="960" y="110" width="210" height="80" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="1065" y="140" text-anchor="middle" font-size="16" font-weight="700">S20 핫스팟</text>
  <text x="1065" y="162" text-anchor="middle" font-size="12" fill="#444">대역 2.4GHz (ESP32는 5GHz 불가)</text>
  <text x="1065" y="179" text-anchor="middle" font-size="12" fill="#444">EON·ESP32가 같이 접속</text>
  <rect x="960" y="230" width="210" height="100" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="1065" y="258" text-anchor="middle" font-size="17" font-weight="700">EON</text>
  <text x="1065" y="282" text-anchor="middle" font-size="12" fill="#444">차선변경 시작 때 L/R 전송</text>
  <text x="1065" y="302" text-anchor="middle" font-size="12" fill="#444">ESP32 연결 상태 화면 표시</text>
  <text x="1065" y="320" text-anchor="middle" font-size="11" fill="#888">판다·M-CAN 변환기 #1 그대로</text>
  <g fill="none" stroke-width="3" stroke-dasharray="6 5">
    <path d="M890 150 L960 150" stroke="#ef6c00"/>
    <path d="M1065 190 L1065 230" stroke="#ef6c00"/>
  </g>
  <text x="925" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#ef6c00">Wi-Fi</text>
  <text x="1075" y="215" font-size="11" font-weight="700" fill="#ef6c00">Wi-Fi</text>

  <!-- ===== CAN wires (direct) ===== -->
  <path d="M237 216 L420 216 L420 225 L572 225" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linejoin="round"/>
  <path d="M191 231 L191 240 L400 240 L400 260 L572 260" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round"/>
  <text x="495" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">녹색 → H</text>
  <text x="495" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">주황 → L</text>
  <text x="495" y="300" text-anchor="middle" font-size="11" fill="#666">(변환기 없이 직결)</text>

  <!-- ===== Power ===== -->
  <rect x="260" y="470" width="250" height="66" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="385" y="497" text-anchor="middle" font-size="15" font-weight="700">차량 12V (퓨즈 탭, IGN)</text>
  <text x="385" y="520" text-anchor="middle" font-size="12" fill="#444">시동 ON에서만 전원 · 퓨즈 2A</text>
  <path d="M510 492 L540 492 L540 345 L572 345" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round"/>
  <rect x="260" y="560" width="250" height="40" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="385" y="585" text-anchor="middle" font-size="14" font-weight="700">차체 접지 (볼트)</text>
  <path d="M510 580 L560 580 L560 370 L572 370" fill="none" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>

  <!-- Notes -->
  <g font-size="13" fill="#222">
    <text x="30" y="640" font-weight="700">확인 사항 (2026-11-14 실차: 원터치 1회 = 외부 램프 5회, 경고 없음)</text>
    <text x="30" y="664">• 변환기 없이 보드 CAN H/L을 M01 1번(녹색)/2번(주황)에 직결. M01 6번 접지는 CAN에 연결 안 함(보드 CAN 절연형).</text>
    <text x="30" y="688">• 보드 CAN 점퍼는 반드시 NC (전원 끄고 H–L 사이 OL). 마이컴 내장 변환기는 B-CAN을 마비시켜 사용 금지.</text>
    <text x="30" y="712">• 보드 전원은 DC 단자에 시동 연동 12V(IGN) → 시동 끄면 보드도 꺼짐. 상시 전원(B+) 금지.</text>
    <text x="30" y="736">• 처음 며칠: 다음 날 시동·스마트키·문 잠금·계기판 경고 확인. 이상하면 TJA1055T/3 저속 CAN 칩 모듈로 교체.</text>
    <text x="30" y="760">• 운전자 레버 사용 중·비상등 켜짐·순정 0x138 미수신·버스 오류 시 ESP32는 송신하지 않음.</text>
  </g>
</svg>
