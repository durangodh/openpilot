<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111">제네시스 DH B-CAN 깜빡이 레버 로깅 배선도</text>
  <text x="550" y="64" text-anchor="middle" font-size="14" fill="#555">차량 B-CAN(저속) → 저속↔고속 변환기 → ESP32-S3-RS485-CAN 보드 → 노트북 (수신 전용)</text>

  <!-- ===== Car M01 ===== -->
  <rect x="30" y="110" width="250" height="330" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="155" y="140" text-anchor="middle" font-size="17" font-weight="700">차량 M01</text>
  <text x="155" y="162" text-anchor="middle" font-size="13" fill="#444">다기능 스위치 (회색 10핀)</text>
  <text x="155" y="180" text-anchor="middle" font-size="12" fill="#666">커넥터는 꽂은 채 뒤쪽에서 분기</text>
  <!-- connector face -->
  <rect x="70" y="195" width="170" height="80" fill="#ddd" stroke="#555"/>
  <g font-size="13" text-anchor="middle">
    <rect x="76" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="90" y="221">5</text>
    <rect x="108" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="122" y="221">4</text>
    <rect x="140" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="154" y="221">3</text>
    <rect x="172" y="201" width="28" height="30" fill="#fff" stroke="#777"/><text x="186" y="221">2</text>
    <rect x="204" y="201" width="28" height="30" fill="#4caf50" stroke="#2e7d32"/><text x="218" y="221" fill="#fff" font-weight="700">1</text>
    <rect x="172" y="201" width="28" height="30" fill="#fb8c00" stroke="#e65100"/><text x="186" y="221" fill="#fff" font-weight="700">2</text>
    <rect x="76" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="90" y="259">10</text>
    <rect x="108" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="122" y="259">9</text>
    <rect x="140" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="154" y="259">8</text>
    <rect x="172" y="239" width="28" height="30" fill="#fff" stroke="#777"/><text x="186" y="259">7</text>
    <rect x="204" y="239" width="28" height="30" fill="#212121" stroke="#000"/><text x="218" y="259" fill="#fff" font-weight="700">6</text>
  </g>
  <g font-size="14">
    <circle cx="60" cy="310" r="7" fill="#4caf50"/><text x="74" y="315"><tspan font-weight="700">1번 녹색</tspan> B-CAN High</text>
    <circle cx="60" cy="340" r="7" fill="#fb8c00"/><text x="74" y="345"><tspan font-weight="700">2번 주황</tspan> B-CAN Low</text>
    <circle cx="60" cy="370" r="7" fill="#212121"/><text x="74" y="375"><tspan font-weight="700">6번 검정</tspan> 접지(GND)</text>
  </g>
  <text x="155" y="415" text-anchor="middle" font-size="12" fill="#c62828" font-weight="700">노란 커넥터(에어백) 건드리지 말 것</text>

  <!-- ===== Converter ===== -->
  <rect x="360" y="110" width="330" height="330" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="525" y="140" text-anchor="middle" font-size="17" font-weight="700">저속↔고속 변환기 (새 제품)</text>
  <text x="525" y="162" text-anchor="middle" font-size="13" fill="#444">TJA1054 低速容错 CAN 转高速 CAN · 100 kbps 지원</text>
  <!-- low side terminal -->
  <rect x="372" y="200" width="88" height="80" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="416" y="194" text-anchor="middle" font-size="12" fill="#1b5e20">저속 단자</text>
  <text x="384" y="230" font-size="14" font-weight="700">CANH</text>
  <text x="384" y="265" font-size="14" font-weight="700">CANL</text>
  <!-- high side terminal -->
  <rect x="590" y="185" width="88" height="200" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="634" y="179" text-anchor="middle" font-size="12" fill="#1b5e20">고속·전원 단자</text>
  <g font-size="14" font-weight="700">
    <text x="600" y="213">9~24V</text>
    <text x="600" y="250">CANH</text>
    <text x="600" y="287" fill="#888">PE ✕</text>
    <text x="600" y="324">CANL</text>
    <text x="600" y="361">GND</text>
  </g>
  <rect x="470" y="330" width="100" height="40" rx="6" fill="#fff59d" stroke="#f9a825"/>
  <text x="520" y="348" text-anchor="middle" font-size="12" font-weight="700">종단 점퍼</text>
  <text x="520" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">끼움(ON)</text>
  <text x="525" y="415" text-anchor="middle" font-size="12" fill="#444">PE는 연결 안 함</text>

  <!-- ===== ESP32 board ===== -->
  <rect x="770" y="110" width="300" height="330" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="920" y="140" text-anchor="middle" font-size="17" font-weight="700">ESP32-S3-RS485-CAN</text>
  <text x="920" y="162" text-anchor="middle" font-size="13" fill="#444">내장 CAN 칩 = GPIO15(TX) / GPIO16(RX)</text>
  <rect x="782" y="222" width="80" height="80" fill="#90caf9" stroke="#1565c0"/>
  <text x="822" y="216" text-anchor="middle" font-size="12" fill="#0d47a1">CAN 단자</text>
  <text x="796" y="250" font-size="14" font-weight="700">H</text>
  <text x="796" y="287" font-size="14" font-weight="700">L</text>
  <rect x="782" y="330" width="80" height="50" fill="#90caf9" stroke="#1565c0"/>
  <text x="822" y="324" text-anchor="middle" font-size="12" fill="#0d47a1">DC 단자</text>
  <text x="792" y="352" font-size="13" font-weight="700">GND</text>
  <text x="792" y="372" font-size="13" fill="#888">VCC ✕</text>
  <rect x="890" y="222" width="110" height="40" rx="6" fill="#fff59d" stroke="#f9a825"/>
  <text x="945" y="240" text-anchor="middle" font-size="12" font-weight="700">120Ω 점퍼</text>
  <text x="945" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">ON</text>
  <text x="945" y="290" text-anchor="middle" font-size="12" fill="#888">RS485 A/B 사용 안 함</text>
  <rect x="980" y="330" width="74" height="40" rx="6" fill="#cfd8dc" stroke="#455a64"/>
  <text x="1017" y="355" text-anchor="middle" font-size="13" font-weight="700">USB-C</text>

  <!-- ===== Wires ===== -->
  <!-- M01 pin1 green -> LS CANH (above the box) -->
  <path d="M232 216 L330 216 L330 225 L372 225" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linejoin="round"/>
  <!-- M01 pin2 orange -> LS CANL -->
  <path d="M186 231 L186 235 L345 235 L345 260 L372 260" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linejoin="round"/>
  <!-- M01 pin6 black -> conv GND -->
  <path d="M218 269 L218 290 L300 290 L300 470 L720 470 L720 356 L678 356" fill="none" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
  <!-- HS CANH -> board H -->
  <path d="M678 245 L782 245" fill="none" stroke="#f9a825" stroke-width="5"/>
  <text x="742" y="237" text-anchor="middle" font-size="12" font-weight="700">CANH</text>
  <!-- HS CANL -> board L -->
  <path d="M678 319 L760 319 L760 282 L782 282" fill="none" stroke="#1e88e5" stroke-width="5" stroke-linejoin="round"/>
  <text x="730" y="311" text-anchor="middle" font-size="12" font-weight="700">CANL</text>
  <!-- conv GND -> board GND -->
  <path d="M720 356 L782 356" fill="none" stroke="#212121" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="751" y="348" text-anchor="middle" font-size="11">GND 공통</text>

  <!-- 12V supply: drawn last with a white halo so crossings read as jumps -->
  <rect x="360" y="510" width="230" height="62" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="475" y="536" text-anchor="middle" font-size="15" font-weight="700">차량 12V (퓨즈 탭)</text>
  <text x="475" y="557" text-anchor="middle" font-size="12" fill="#444">ACC/IGN 전원 · 퓨즈 1~2A</text>
  <path d="M590 541 L697 541 L697 208 L678 208" fill="none" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>
  <path d="M590 541 L697 541 L697 208 L678 208" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round"/>
  <text x="643" y="532" text-anchor="middle" font-size="12" font-weight="700" fill="#d32f2f">+12V → 9~24V</text>

  <!-- Laptop -->
  <rect x="930" y="510" width="140" height="62" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="1000" y="536" text-anchor="middle" font-size="15" font-weight="700">노트북</text>
  <text x="1000" y="557" text-anchor="middle" font-size="12" fill="#444">시리얼 115200</text>
  <path d="M1017 370 L1017 510" fill="none" stroke="#455a64" stroke-width="5"/>
  <text x="1008" y="445" text-anchor="end" font-size="12" font-weight="700">USB-C (전원+로그)</text>

  <!-- Notes -->
  <g font-size="13" fill="#222">
    <text x="30" y="610" font-weight="700">확인 사항</text>
    <text x="30" y="633">• 펌웨어 맨 위: CAN_TX_PIN 15 · CAN_RX_PIN 16 · FT_EN_PIN -1 · FT_STB_PIN -1 (수신 전용, 차에 아무것도 안 보냄)</text>
    <text x="30" y="655">• 변환기↔보드 고속 구간은 두 장치뿐이라 양쪽 종단(변환기 점퍼, 보드 120Ω) 모두 ON. 차량 B-CAN 쪽 저항은 손대지 않음</text>
    <text x="30" y="677">• 전선은 자르지 말고 백프로빙/T-탭으로 분기. 보드 VCC·RS485·기존 M-CAN 변환기는 그대로 둠</text>
    <text x="30" y="699">• 시동 ON·P단에서 s로 ID 확인 → n → l → r → x 를 2~3회 반복, 시리얼 내용을 통째로 보내기</text>
  </g>
</svg>
