name: Build EON R1 BLE receiver

on:
  workflow_dispatch:
  push:
    branches: [g_remote]
    paths:
      - 'selfdrive/eon_cluster/eon_ble_remote/**'
      - '.github/workflows/build-eon-ble-remote.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check R1 BLE report and bridge authentication
        run: |
          python3 -m unittest selfdrive.eon_cluster.test_ble_r1
          python3 -m py_compile selfdrive/eon_cluster/direct_remote.py
      - name: Build APK
        working-directory: selfdrive/eon_cluster/eon_ble_remote
        run: gradle :app:assembleDebug --no-daemon
      - name: Check APK minimum Android API
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            selfdrive/eon_cluster/eon_ble_remote/app/build/outputs/apk/debug/app-debug.apk \
            | grep -F "sdkVersion:'21'"
      - uses: actions/upload-artifact@v4
        with:
          name: eon-ble-remote-apk
          path: selfdrive/eon_cluster/eon_ble_remote/app/build/outputs/apk/debug/app-debug.apk
