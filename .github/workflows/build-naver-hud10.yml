name: Build and release CarrotNaver HUD10

on:
  workflow_dispatch:
  push:
    branches: [g_hud]
    paths: [".github/workflows/build-naver-hud10.yml"]

permissions:
  contents: write

concurrency:
  group: naver-hud10-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Prepare verified input and tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$RUNNER_TEMP/naver-input" "$RUNNER_TEMP/naver-sdk"
          ln -s "$ANDROID_HOME/platforms" "$RUNNER_TEMP/naver-sdk/platforms"
          ln -s "$ANDROID_HOME/build-tools" "$RUNNER_TEMP/naver-sdk/build-tools"
          gh release download carrot-naver-6.9.1.3-hud6 --pattern 'CarrotNaver_6.9.1.3_hud6.apks' --dir "$RUNNER_TEMP/naver-input"
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
      - name: Test and rebuild Naver bridge
        run: |
          javac -d "$RUNNER_TEMP/naver-codes" selfdrive/eon_cluster/naver_bridge/CarrotNaverCodes.java selfdrive/eon_cluster/naver_bridge/CarrotNaverCodesCheck.java
          java -cp "$RUNNER_TEMP/naver-codes" com.naver.map.carrot.CarrotNaverCodesCheck
          python3 selfdrive/eon_cluster/naver_bridge/build_phone_recovery.py \
            --input "$RUNNER_TEMP/naver-input/CarrotNaver_6.9.1.3_hud6.apks" \
            --java-home "$JAVA_HOME" --sdk "$RUNNER_TEMP/naver-sdk" \
            --apktool "$RUNNER_TEMP/apktool.jar" --work "$RUNNER_TEMP/naver-build" \
            --output "$RUNNER_TEMP/naver-unsigned.apk"
      - name: Sign all splits and verify
        env:
          HUD_KEY_DATA: ${{ secrets.REMOTE_HUD_KEYSTORE_BASE64 }}
          HUD_STORE_PASSWORD: ${{ secrets.REMOTE_HUD_KEYSTORE_PASSWORD }}
          HUD_KEY_ALIAS: ${{ secrets.REMOTE_HUD_KEY_ALIAS }}
          HUD_KEY_PASSWORD: ${{ secrets.REMOTE_HUD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, zipfile
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          out = pathlib.Path("naver-release")
          out.mkdir()
          for key in ("HUD_KEY_DATA", "HUD_STORE_PASSWORD", "HUD_KEY_ALIAS", "HUD_KEY_PASSWORD"):
              if not os.environ.get(key):
                  raise RuntimeError(key + " missing")
          keystore = temp / "naver-signing.p12"
          keystore.write_bytes(base64.b64decode(os.environ["HUD_KEY_DATA"], validate=True))
          keystore.chmod(0o600)
          tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools/35.0.0"
          parts = []
          certificates = set()
          with zipfile.ZipFile(temp / "naver-input/CarrotNaver_6.9.1.3_hud6.apks") as original:
              names = [n for n in original.namelist() if n.endswith(".apk")]
              if sorted(names) != ["base.apk", "split_config.arm64_v8a.apk", "split_config.xxhdpi.apk"]:
                  raise RuntimeError("Unexpected split set")
              for name in names:
                  raw = temp / ("unsigned-" + name)
                  raw.write_bytes((temp / "naver-unsigned.apk").read_bytes() if name == "base.apk" else original.read(name))
                  aligned = temp / ("aligned-" + name)
                  signed = temp / ("signed-" + name)
                  subprocess.run([str(tools / "zipalign"), "-P", "16", "-f", "4", str(raw), str(aligned)], check=True)
                  subprocess.run([str(tools / "apksigner"), "sign", "--ks", str(keystore),
                                  "--ks-key-alias", os.environ["HUD_KEY_ALIAS"],
                                  "--ks-pass", "env:HUD_STORE_PASSWORD", "--key-pass", "env:HUD_KEY_PASSWORD",
                                  "--out", str(signed), str(aligned)], check=True)
                  verify = subprocess.check_output([str(tools / "apksigner"), "verify", "--verbose", "--print-certs", str(signed)], text=True)
                  cert = re.search(r"Signer #1 certificate SHA-256 digest: ([0-9a-f]+)", verify).group(1)
                  certificates.add(cert)
                  subprocess.run([str(tools / "zipalign"), "-c", "-P", "16", "4", str(signed)], check=True)
                  parts.append((name, signed))
          if len(certificates) != 1:
              raise RuntimeError("Split certificates differ")
          bundle = out / "CarrotNaver_6.9.1.3_hud10.apks"
          with zipfile.ZipFile(bundle, "w", zipfile.ZIP_STORED) as apkset:
              for name, signed in parts:
                  apkset.write(signed, name)
          report = {"artifact": bundle.name, "sha256": hashlib.sha256(bundle.read_bytes()).hexdigest(),
                    "certificate_sha256": next(iter(certificates)), "commit": os.environ["GITHUB_SHA"],
                    "all_splits_verified": True, "zip_alignment_16k_verified": True,
                    "device_tested": False, "requires_uninstall_hud8": True, "same_signing_key_as_hud9": True, "map_capture_baseline": "923215be90af6019222a251ebae011bdf6b1b445 / HUD6",
                    "parts": [{"name": n, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for n, p in parts]}
          (out / "naver-hud10-verification.json").write_text(json.dumps(report, indent=2) + "\n")
          keystore.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: carrot-naver-hud10
          path: naver-release/*
      - name: Publish HUD10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/naver-notes.md" <<'EOF'
          네이버 HUD10: 정상 확인된 HUD6 지도 표시 방식 복구

          사용자가 지도 표시를 확인한 923215be 커밋의 HUD6 APKS를 기준으로 빌드했습니다.
          HUD7 이후 추가된 차량 Surface 차단 조건과 별도 지도 렌더러가 들어가지 않습니다.
          지도 캡처 메서드와 관련 클래스는 HUD6 그대로 유지하고, 방향·차선·안전 안내 코드 변환만 추가했습니다.
          EON의 최신 방향 안내 활성 판정 수정도 유지됩니다.

          **HUD9 사용자는 덮어 설치할 수 있습니다. HUD8 이하 사용자는 서명이 달라 기존 네이버 수정본 삭제 후 APKS를 설치해야 합니다. 삭제하면 앱 데이터가 지워질 수 있습니다.**
          기본 APK와 분할 APK의 동일 서명, 16 KiB ZIP 정렬, 안내 코드 검사 및 지도 캡처 메서드 보존 검사를 통과했습니다.
          실제 S9 화면은 아직 검증하지 않았습니다. 앱 내부 버전은 6.9.1.3이며 HUD10은 수정본 구분명입니다.
          EOF
          gh release create carrot-naver-6.9.1.3-hud10 naver-release/* \
            --target "$GITHUB_SHA" --title "CarrotNaver 6.9.1.3 HUD10" \
            --notes-file "$RUNNER_TEMP/naver-notes.md"
