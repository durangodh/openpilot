name: Build and release CarrotNaver HUD13.7

on:
  workflow_dispatch:
  push:
    branches: [g_remote]
    paths:
      - ".github/workflows/build-naver-hud13.7.yml"
      - "selfdrive/eon_cluster/naver_bridge/CarrotCarMapSnapshot.java"
      - "selfdrive/eon_cluster/naver_bridge/CarrotTrafficSignalCapture.java"
      - "selfdrive/eon_cluster/naver_bridge/CarrotHudLog.java"
      - "selfdrive/eon_cluster/naver_bridge/CarrotNaverCodes.java"
      - "selfdrive/eon_cluster/naver_bridge/build_car_snapshot.py"
      - "selfdrive/eon_cluster/naver_bridge/build_traffic_signal.py"
      - "selfdrive/eon_cluster/naver_bridge/test_car_snapshot.py"

permissions:
  contents: write

concurrency:
  group: naver-hud13.7-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Prepare HUD13.6 and tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$RUNNER_TEMP/naver-input" "$RUNNER_TEMP/naver-sdk"
          ln -s "$ANDROID_HOME/platforms" "$RUNNER_TEMP/naver-sdk/platforms"
          ln -s "$ANDROID_HOME/build-tools" "$RUNNER_TEMP/naver-sdk/build-tools"
          gh release download carrot-naver-6.9.1.3-hud13.6 --pattern 'CarrotNaver_6.9.1.3_hud13.6.apks' --dir "$RUNNER_TEMP/naver-input"
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
      - name: Test native traffic signal and rebuild
        run: |
          python3 selfdrive/eon_cluster/naver_bridge/test_car_snapshot.py --java-home "$JAVA_HOME" --work "$RUNNER_TEMP/naver-snapshot-check"
          python3 selfdrive/eon_cluster/naver_bridge/build_traffic_signal.py \
            --input "$RUNNER_TEMP/naver-input/CarrotNaver_6.9.1.3_hud13.6.apks" \
            --java-home "$JAVA_HOME" --sdk "$RUNNER_TEMP/naver-sdk" \
            --apktool "$RUNNER_TEMP/apktool.jar" --work "$RUNNER_TEMP/naver-build" \
            --output "$RUNNER_TEMP/naver-unsigned.apk"
      - name: Sign all splits with the existing HUD key and verify
        env:
          HUD_KEY_DATA: ${{ secrets.REMOTE_HUD_KEYSTORE_BASE64 }}
          HUD_STORE_PASSWORD: ${{ secrets.REMOTE_HUD_KEYSTORE_PASSWORD }}
          HUD_KEY_ALIAS: ${{ secrets.REMOTE_HUD_KEY_ALIAS }}
          HUD_KEY_PASSWORD: ${{ secrets.REMOTE_HUD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, zipfile
          expected_cert = "8864e2b9ad307f5f189de9c747697854275089fc81296d6fbb5b2a9576d23c06"
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          out = pathlib.Path("naver-release")
          out.mkdir()
          for key in ("HUD_KEY_DATA", "HUD_STORE_PASSWORD", "HUD_KEY_ALIAS", "HUD_KEY_PASSWORD"):
              if not os.environ.get(key):
                  raise RuntimeError(key + " missing")
          keystore = temp / "naver-signing.p12"
          keystore.write_bytes(base64.b64decode(os.environ["HUD_KEY_DATA"], validate=True))
          keystore.chmod(0o600)
          tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools/35.0.0"
          parts = []
          certificates = set()
          with zipfile.ZipFile(temp / "naver-input/CarrotNaver_6.9.1.3_hud13.6.apks") as original:
              names = [n for n in original.namelist() if n.endswith(".apk")]
              if sorted(names) != ["base.apk", "split_config.arm64_v8a.apk", "split_config.xxhdpi.apk"]:
                  raise RuntimeError("Unexpected split set")
              for name in names:
                  raw = temp / ("unsigned-" + name)
                  raw.write_bytes((temp / "naver-unsigned.apk").read_bytes() if name == "base.apk" else original.read(name))
                  aligned = temp / ("aligned-" + name)
                  signed = temp / ("signed-" + name)
                  subprocess.run([str(tools / "zipalign"), "-P", "16", "-f", "4", str(raw), str(aligned)], check=True)
                  subprocess.run([str(tools / "apksigner"), "sign", "--ks", str(keystore),
                                  "--ks-key-alias", os.environ["HUD_KEY_ALIAS"],
                                  "--ks-pass", "env:HUD_STORE_PASSWORD", "--key-pass", "env:HUD_KEY_PASSWORD",
                                  "--out", str(signed), str(aligned)], check=True)
                  verify = subprocess.check_output([str(tools / "apksigner"), "verify", "--verbose", "--print-certs", str(signed)], text=True)
                  cert = re.search(r"Signer #1 certificate SHA-256 digest: ([0-9a-f]+)", verify).group(1)
                  certificates.add(cert)
                  subprocess.run([str(tools / "zipalign"), "-c", "-P", "16", "4", str(signed)], check=True)
                  parts.append((name, signed))
          if certificates != {expected_cert}:
              raise RuntimeError("Signing certificate mismatch: " + repr(certificates))
          bundle = out / "CarrotNaver_6.9.1.3_hud13.7.apks"
          with zipfile.ZipFile(bundle, "w", zipfile.ZIP_STORED) as apkset:
              for name, signed in parts:
                  apkset.write(signed, name)
          report = {"artifact": bundle.name, "sha256": hashlib.sha256(bundle.read_bytes()).hexdigest(),
                    "certificate_sha256": expected_cert, "commit": os.environ["GITHUB_SHA"],
                    "all_splits_verified": True, "zip_alignment_16k_verified": True,
                    "device_tested": False, "same_signing_key_as_hud9_through_hud13_6": True,
                    "base_release": "carrot-naver-6.9.1.3-hud13.6",
                    "traffic_signal_change": "native NaviTrafficSignalView captured as transparent PNG",
                    "parts": [{"name": n, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for n, p in parts]}
          (out / "naver-hud13.7-verification.json").write_text(json.dumps(report, indent=2) + "\n")
          keystore.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: carrot-naver-hud13.7
          path: naver-release/*
      - name: Publish HUD13.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/naver-notes.md" <<'EOF'
          네이버 HUD13.7: 신호등 상태와 남은 시간을 Remote HUD 지도에 표시

          네이버의 NaviTrafficSignalView를 투명 PNG로 캡처하여 traffic_signal 스트림으로
          전송합니다. 신호등이 사라지면 HUD 오버레이도 즉시 지웁니다. HUD13.6의 지도,
          차량 GPS, 남은 시간 단위 수정은 그대로 유지합니다.

          HUD9~13.6과 동일한 서명 인증서입니다. 인증서 SHA-256이 기존 값과 다르면
          빌드가 실패하므로 기존 설치 위에 업데이트할 수 있습니다.
          EOF
          gh release create carrot-naver-6.9.1.3-hud13.7 naver-release/* \
            --target "$GITHUB_SHA" --title "CarrotNaver 6.9.1.3 HUD13.7" \
            --notes-file "$RUNNER_TEMP/naver-notes.md"
