name: Build EON Link Android APK
on:
  workflow_dispatch:
  push:
    branches: [g_blinker]
    paths:
      - 'tools/eon_link_android/**'
      - 'selfdrive/modeld/jetlink/**'
      - 'selfdrive/eon_web_jetlink.py'
      - '.github/workflows/build-eon-link-apk.yml'
permissions:
  contents: write
concurrency:
  group: eon-link-android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - name: Test Python client against the actual Java relay
        run: |
          python -m pip install numpy==1.26.4 pytest==8.4.2 pycapnp==2.2.4
          python -m pytest -q selfdrive/modeld/jetlink/tests
      - name: Build with the existing Android signing key
        env:
          KEY_DATA: ${{ secrets.REMOTE_HUD_KEYSTORE_BASE64 }}
          EONLINK_STORE_PASSWORD: ${{ secrets.REMOTE_HUD_KEYSTORE_PASSWORD }}
          EONLINK_KEY_PASSWORD: ${{ secrets.REMOTE_HUD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REMOTE_HUD_KEY_ALIAS }}
          EONLINK_VERSION_CODE: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import base64, os, pathlib, subprocess
          for key in ('KEY_DATA', 'EONLINK_STORE_PASSWORD', 'EONLINK_KEY_PASSWORD', 'KEY_ALIAS'):
              if not os.environ.get(key):
                  raise RuntimeError(key + ' signing secret is missing')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'eon-link-signing.p12'
          key.write_bytes(base64.b64decode(os.environ['KEY_DATA'], validate=True))
          key.chmod(0o600)
          try:
              subprocess.run(['python', 'tools/eon_link_android/build.py', '--keystore', str(key),
                              '--alias', os.environ['KEY_ALIAS'], '--output', 'tools/eon_link_android/build/EON-Link.apk'], check=True)
          finally:
              key.unlink(missing_ok=True)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs tools/eon_link_android/build/EON-Link.apk |
            grep -F 'certificate SHA-256 digest: 8864e2b9ad307f5f189de9c747697854275089fc81296d6fbb5b2a9576d23c06'
      - uses: actions/upload-artifact@v4
        with:
          name: eon-link-android
          path: |
            tools/eon_link_android/build/EON-Link.apk
            tools/eon_link_android/build/EON-Link.apk.sha256
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view eon-link-android >/dev/null 2>&1; then
            gh release create eon-link-android --target "$GITHUB_SHA" --prerelease \
              --title '이온링크 Android 시험 앱' \
              --notes '이온 전용 N16 통신·성능 시험 앱입니다. 기존 Jetlink와 별도 설치되며 모델을 한 번 다시 받아야 합니다. 기존 Jetlink는 종료하고 사용하세요. 차량 제어에는 적용되지 않으며 기기 성능은 재시험이 필요합니다. 사용법: tools/eon_link_android/README.md'
          fi
          gh release upload eon-link-android tools/eon_link_android/build/EON-Link.apk \
            tools/eon_link_android/build/EON-Link.apk.sha256 --clobber
