name: Remove BSD toggle once

on:
  push:
    branches: [g_mdps]

permissions:
  contents: write

jobs:
  remove-bsd-toggle:
    if: github.event.head_commit.message != 'Remove BSD always-display toggle from settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g_mdps
          fetch-depth: 0
      - name: Remove only the BSD settings toggle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('selfdrive/ui/qt/offroad/settings.cc')
          s = p.read_text()
          old = '''  list->addItem(new ParamControl(\n      "ShowBlindSpotAlways", "BSD 영역 상시 표시",\n      "켜짐: BSD 감지가 없을 때도 좌우 사각지대 영역을 흐리게 표시합니다.",\n      "../assets/offroad/icon_road.png", this));\n'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly 1 BSD toggle block, found {n}')
          p.write_text(s.replace(old, '', 1))
          PY
          git diff --check
          git diff -- selfdrive/ui/qt/offroad/settings.cc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/remove-bsd-toggle.yml
          git add selfdrive/ui/qt/offroad/settings.cc
          git commit -m "Remove BSD always-display toggle from settings"
          git push origin HEAD:g_mdps
