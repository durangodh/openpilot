name: Apply full Carrot Phase2 wiring

on:
  push:
    branches:
      - g_abcd
    paths:
      - '.github/workflows/apply-full-phase2-wiring.yml'
      - '.tmp_apply_full_phase2.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g_abcd
          fetch-depth: 0
          persist-credentials: true
      - name: Apply wiring
        run: python3 .tmp_apply_full_phase2.py
      - name: Syntax check
        run: python3 -m py_compile selfdrive/carrot/carrot_lat_learning.py selfdrive/controls/controlsd.py selfdrive/controls/lib/latcontrol_torque.py
      - name: Cleanup and push
        run: |
          rm -f .tmp_apply_full_phase2.py .github/workflows/apply-full-phase2-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete Carrot Phase2 lateral auto tuner"
          git push origin HEAD:g_abcd
