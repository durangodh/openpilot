name: Apply CarrotLat UI delta

on:
  push:
    branches: [g_abcd]
    paths:
      - '.github/workflows/apply-carrot-ui-delta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g_abcd
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .tmp_carrot_ui_delta.patch
          git apply .tmp_carrot_ui_delta.patch
          python3 -m py_compile selfdrive/carrot/carrot_lat_learning.py selfdrive/manager/manager.py
      - name: Cleanup and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp_carrot_ui_delta.patch .github/workflows/apply-carrot-ui-delta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add CarrotLat learning UI and DH-safe delay bounds"
          git push origin HEAD:g_abcd
