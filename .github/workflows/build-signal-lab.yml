name: Build Korean Signal Lab APK (S20)

on:
  workflow_dispatch:
  push:
    branches: [g_blinker]
    paths:
      - 'selfdrive/eon_cluster/android_signal_lab/**'
      - 'selfdrive/eon_cluster/signal_lab/**'
      - '.github/workflows/build-signal-lab.yml'
      - 'selfdrive/controls/lib/conditional_e2e.py'
      - 'selfdrive/controls/lib/longitudinal_planner.py'
      - 'selfdrive/controls/lib/korean_signal.py'
      - 'selfdrive/controls/lib/tests/test_korean_signal.py'
      - 'selfdrive/eon_web.py'

concurrency:
  group: signal-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check pairing, transport, stale detections and Korean decoding
        run: |
          python3 -m unittest discover -s selfdrive/eon_cluster/signal_lab/tests -v
          python3 -m pip install pytest==8.4.2 numpy==2.2.6
          python3 -m pytest -q selfdrive/controls/lib/tests/test_conditional_e2e.py selfdrive/controls/lib/tests/test_signal_assist.py selfdrive/controls/lib/tests/test_korean_signal.py
          javac -d "$RUNNER_TEMP/signal-decoder" selfdrive/eon_cluster/android_signal_lab/src/ai/comma/signallab/Decoder.java selfdrive/eon_cluster/android_signal_lab/tests/DecoderCheck.java
          java -cp "$RUNNER_TEMP/signal-decoder" ai.comma.signallab.DecoderCheck
      - name: Build and verify same-signature main-phone APK
        run: |
          export SIGNAL_LAB_VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))
          export SIGNAL_LAB_VERSION_NAME="0.5-stop-r${GITHUB_RUN_NUMBER}"
          python3 selfdrive/eon_cluster/android_signal_lab/build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: eon-signal-lab-korea
          path: |
            selfdrive/eon_cluster/android_signal_lab/EonSignalLab-Korea-latest.apk
            selfdrive/eon_cluster/android_signal_lab/EonSignalLab-Korea-latest.apk.sha256
      - name: Publish main-phone APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view signal-lab-auto >/dev/null 2>&1; then
            gh release create signal-lab-auto --target "$GITHUB_SHA" \
              --title "EON Korean Signal Lab" \
              --notes "Korean traffic-light recognition on the S20 for the EON signal stop. Four-digit pairing. Corresponding source is in selfdrive/eon_cluster/android_signal_lab and signal_lab."
          fi
          cat > "$RUNNER_TEMP/signal-lab-notes.md" <<'NOTES'
          Korean traffic-light app for the S20 HUD phone: analyses EON's road camera and helps EON's automatic signal stop.
          A stable red (or an amber EON can still stop for) lets weaker model slowing count as a signal stop, and while stopped for it a model-only launch waits. Green departure is the model's own. Gas always wins; stale or missing results leave the stop exactly as before. Switch: EON Web, on by default. Runs every drive after pairing once (starts on phone boot). No vehicle testing claimed.
          Corresponding source: selfdrive/eon_cluster/android_signal_lab, signal_lab and selfdrive/controls/lib/korean_signal.py.
          NOTES
          gh release edit signal-lab-auto --notes-file "$RUNNER_TEMP/signal-lab-notes.md"
          gh release upload signal-lab-auto \
            selfdrive/eon_cluster/android_signal_lab/EonSignalLab-Korea-latest.apk \
            selfdrive/eon_cluster/android_signal_lab/EonSignalLab-Korea-latest.apk.sha256 --clobber
