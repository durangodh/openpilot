name: Build Galaxy S9 Remote HUD APK

on:
  workflow_dispatch:
  push:
    branches: [g_abcd]
    paths:
      - "selfdrive/eon_cluster/android_hud/**"
      - ".github/workflows/build-remote-hud.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: remote-hud-debug-keystore-v1
      - name: Create debug keystore if missing
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - name: Fix displayed version label only
        shell: bash
        run: |
          sed -i 's/v0\.13  ·  부팅 지연·자동복구 \/ 1CBE:0092/v0.16  ·  부팅 지연·자동복구 \/ 1CBE:0092/' selfdrive/eon_cluster/android_hud/app/src/main/java/ai/comma/remotehud/MainActivity.java
      - name: Apply live S9 render tuning
        run: python3 selfdrive/eon_cluster/android_hud/apply_runtime_tuning.py
      - name: Preserve runtime 3D helpers
        shell: bash
        run: |
          sed -i "s/'    private float\[\] project('/'    private float pathCenterAt('/" selfdrive/eon_cluster/android_hud/apply_s9_3d_patch.py
      - name: Apply full S9 perspective 3D renderer
        run: python3 selfdrive/eon_cluster/android_hud/apply_s9_3d_patch.py
      - name: Build debug APK
        working-directory: selfdrive/eon_cluster/android_hud
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: eon-remote-hud-s9-debug
          path: selfdrive/eon_cluster/android_hud/app/build/outputs/apk/debug/app-debug.apk
