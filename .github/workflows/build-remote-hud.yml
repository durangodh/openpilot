name: Build Galaxy S9 Remote HUD APK

on:
  workflow_dispatch:
  push:
    branches: [g_abcd, g_hud]
    paths:
      - "selfdrive/eon_cluster/android_hud/**"
      - "selfdrive/eon_cluster/naver_bridge/**"
      - ".github/workflows/build-remote-hud.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore permanent Remote HUD signing key
        shell: bash
        env:
          REMOTE_HUD_KEYSTORE_BASE64: ${{ secrets.REMOTE_HUD_KEYSTORE_BASE64 }}
          REMOTE_HUD_KEYSTORE_PASSWORD: ${{ secrets.REMOTE_HUD_KEYSTORE_PASSWORD }}
          REMOTE_HUD_KEY_ALIAS: ${{ secrets.REMOTE_HUD_KEY_ALIAS }}
          REMOTE_HUD_KEY_PASSWORD: ${{ secrets.REMOTE_HUD_KEY_PASSWORD }}
        run: |
          for required in REMOTE_HUD_KEYSTORE_BASE64 REMOTE_HUD_KEYSTORE_PASSWORD \
            REMOTE_HUD_KEY_ALIAS REMOTE_HUD_KEY_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "$required secret is missing" >&2
              exit 1
            fi
          done
          printf '%s' "$REMOTE_HUD_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/remote-hud-signing.p12"
          chmod 600 "$RUNNER_TEMP/remote-hud-signing.p12"
          echo "REMOTE_HUD_KEYSTORE_PATH=$RUNNER_TEMP/remote-hud-signing.p12" >> "$GITHUB_ENV"
          echo "REMOTE_HUD_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "REMOTE_HUD_VERSION_NAME=1.23-no-extra-vehicle-detector" >> "$GITHUB_ENV"
      # v0.19+ builds the checked-in tree as-is.
      # The old sed / apply_runtime_tuning.py / apply_s9_3d_patch.py steps are gone:
      # they rewrote v0.17 sources into v0.18 at build time, which is why the
      # installed APK always ran ahead of the repository.
      - name: Check navigation without map frames
        working-directory: selfdrive/eon_cluster/android_hud
        run: |
          python3 tests/test_navigation_render.py --java-home "$JAVA_HOME" --work "$RUNNER_TEMP/hud-navigation-check"
          python3 ../tests/test_naver_guidance.py
      - name: Check navigation selection
        # Exercise retransmission and old acknowledgements before packaging.
        working-directory: selfdrive/eon_cluster/android_hud
        run: |
          python3 ../tests/test_nav_selection.py
          python3 ../tests/test_tmap_guidance.py
          javac -d "$RUNNER_TEMP/hud-selection-check" app/src/main/java/ai/comma/remotehud/NavSelectionProtocol.java tests/NavSelectionProtocolCheck.java
          java -cp "$RUNNER_TEMP/hud-selection-check" ai.comma.remotehud.NavSelectionProtocolCheck
      - name: Check Naver phone and car map capture
        # The Naver bridge shares the HUD map transport; cover both sources.
        working-directory: selfdrive/eon_cluster/naver_bridge
        run: |
          python3 test_car_capture.py --java-home "$JAVA_HOME" --work "$RUNNER_TEMP/naver-car-capture-check"
          python3 test_offscreen_map.py --java-home "$JAVA_HOME" --work "$RUNNER_TEMP/naver-offscreen-map-check"
          javac -d "$RUNNER_TEMP/naver-code-check" CarrotNaverCodes.java CarrotNaverCodesCheck.java
          java -cp "$RUNNER_TEMP/naver-code-check" com.naver.map.carrot.CarrotNaverCodesCheck
      - name: Build debug APK
        working-directory: selfdrive/eon_cluster/android_hud
        env:
          REMOTE_HUD_KEYSTORE_PASSWORD: ${{ secrets.REMOTE_HUD_KEYSTORE_PASSWORD }}
          REMOTE_HUD_KEY_ALIAS: ${{ secrets.REMOTE_HUD_KEY_ALIAS }}
          REMOTE_HUD_KEY_PASSWORD: ${{ secrets.REMOTE_HUD_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: eon-remote-hud-s9-debug
          path: selfdrive/eon_cluster/android_hud/app/build/outputs/apk/debug/app-debug.apk
